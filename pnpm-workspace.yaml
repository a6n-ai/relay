packages:
  - "apps/*"
  - "packages/*"

allowBuilds:
  esbuild: true
  unrs-resolver: true

# Git tarballs declare workspace:* internals. Overrides turn those into
# github: path deps, which pnpm 11 treats as exotic subdeps unless this is off.
blockExoticSubdeps: false

packageExtensions:
  next:
    dependencies:
      babel-plugin-react-compiler: "^1.0.0"

overrides:
  "@hono/node-server@<2.1.3": "^2.1.3"
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=4 <5.0.12": "^5.0.12"
  "esbuild@<=0.24.2": "^0.25.0"
  "fast-uri@>=3 <3.1.9": "^3.1.9"
  "glob@>=9 <=14.0.1": "^14.0.2"
  "hono@<4.13.11": "^4.13.11"
  "ip-address@<=10.7.3": "^10.7.4"
  "minimatch@>=7 <11.0.1": "^11.0.1"
  "systeminformation@<5.33.16": "^5.33.16"
  proxy-addr: "^2.0.8"
  body-parser: "^2.4.0"
  qs: "^6.16.1"
  better-auth: "^1.7.12"
  "@foundry/ai": "github:a6n-ai/foundry#path:packages/ai"
  "@foundry/cloud": "github:a6n-ai/foundry#path:packages/cloud"
  "@foundry/auth": "github:a6n-ai/foundry#path:packages/auth"
  "@foundry/auth-ui": "github:a6n-ai/foundry#path:packages/auth-ui"
  "@foundry/commons": "github:a6n-ai/foundry#path:packages/commons"
  "@foundry/crm": "github:a6n-ai/foundry#path:packages/crm"
  "@foundry/database": "github:a6n-ai/foundry#path:packages/database"
  "@foundry/design-system": "github:a6n-ai/foundry#path:packages/design-system"
  "@foundry/eslint-config": "github:a6n-ai/foundry#path:tooling/eslint-config"
  "@foundry/realtime": "github:a6n-ai/foundry#path:packages/realtime"
  "@foundry/storage": "github:a6n-ai/foundry#path:packages/storage"
  "@foundry/themes": "github:a6n-ai/foundry#path:packages/themes"
  "@foundry/ui": "github:a6n-ai/foundry#path:packages/ui"

minimumReleaseAgeExclude:
