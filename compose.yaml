# Local Postgres for operator app + automated/manual checks.
#   docker compose up -d
#   cp apps/relay/.env.example apps/relay/.env.local
#   pnpm --filter relay db:migrate && SEED_ADMIN_PASSWORD=dev pnpm --filter relay db:seed
#   pnpm dev
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay
      POSTGRES_DB: relay
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 5s
      retries: 20
