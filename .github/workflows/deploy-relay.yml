# Relay (apps/relay-v2) on Cloudflare Workers, Worker name "relay". Push to main checks the app, then deploys it while the
# repo variable RELAY_DEPLOY is 1 (on since 2026-11-25; set it to 0 to pause deploys).
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, INTERNAL_SECRET (same value as the Worker secret).
# Optional repo variable RELAY_URL: https origin the DO sweep calls (default https://relay.a6n.ai; use the workers.dev URL before the hostname swap).
name: deploy-relay
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/relay-v2/**"
      - "apps/relay-docs/**"
      - ".github/workflows/deploy-relay.yml"
concurrency:
  group: deploy-relay
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/relay-v2 run typecheck
      - run: pnpm --dir apps/relay-v2 run test
      - run: pnpm --dir apps/relay-v2 run build
      - name: Client bundle must hold no server secrets
        run: |
          test -d apps/relay-v2/dist/client
          if grep -rlE "BETTER_AUTH_SECRET|INTERNAL_SECRET|SEED_SECRET|WEBHOOK_SECRET_KEY|UNSUBSCRIBE_SECRET|AWS_SECRET_ACCESS_KEY" apps/relay-v2/dist/client; then
            echo "secret name found in client bundle"
            exit 1
          fi
  deploy:
    needs: check
    if: vars.RELAY_DEPLOY == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build, migrate D1, deploy Worker, DO sweep
        run: pnpm --dir apps/relay-v2 run deploy --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
          RELAY_URL: ${{ vars.RELAY_URL }}
