name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml', 'turbo.json') }}
          restore-keys: turbo-${{ runner.os }}-
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      # Schema drift: a schema change with no migration makes generate write a new file.
      - name: Check migrations match the schema
        env:
          # generate only diffs the schema against the snapshots; it never connects.
          DATABASE_URL: postgres://ci:ci@127.0.0.1:1/ci
        run: |
          pnpm --dir apps/relay exec drizzle-kit generate
          if [ -n "$(git status --porcelain apps/relay/db/migrations)" ]; then
            echo "Schema changed without a migration: run pnpm --filter relay db:generate"; exit 1
          fi
