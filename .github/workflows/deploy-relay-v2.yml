# relay-v2 on Cloudflare Workers. Push to main checks the app; the deploy job runs only when the
# repo variable RELAY_V2_DEPLOY is 1 (off until phase 7b), so merging this deploys nothing.
# Repo secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID, INTERNAL_SECRET (same value as the Worker secret).
name: deploy-relay-v2
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/relay-v2/**"
      - ".github/workflows/deploy-relay-v2.yml"
concurrency:
  group: deploy-relay-v2
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir apps/relay-v2 run typecheck
      - run: pnpm --dir apps/relay-v2 run test
      - run: pnpm --dir apps/relay-v2 run build
      - name: Client bundle must hold no server secrets
        run: |
          if grep -rlE "BETTER_AUTH_SECRET|INTERNAL_SECRET|SEED_SECRET|WEBHOOK_SECRET_KEY|UNSUBSCRIBE_SECRET|AWS_SECRET_ACCESS_KEY" apps/relay-v2/dist/client; then
            echo "secret name found in client bundle"
            exit 1
          fi
  deploy:
    needs: check
    if: vars.RELAY_V2_DEPLOY == '1' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate D1, deploy Worker, DO sweep
        run: pnpm --dir apps/relay-v2 run deploy --apply
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INTERNAL_SECRET: ${{ secrets.INTERNAL_SECRET }}
