name: Bug
description: Something in Relay does not match expected behavior
title: "[bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: Use a private vulnerability report for secrets or auth bypass. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Surface
      options:
        - Operator console
        - POST /v1/messages
        - Operator JSON (/api/notifications)
        - Mailbox / tags
        - Drain worker / outbox
        - Docs / OpenAPI
        - Other
    validations:
      required: true
  - type: input
    id: repro
    attributes:
      label: Repro (optional)
      description: Branch, commit, or curl. No secrets.
